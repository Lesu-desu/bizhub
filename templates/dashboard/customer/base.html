<!-- WhatsApp Floating Button -->
<a href="https://wa.me/{{ support_settings.support_phone }}?text=Hello%2C%20I%20need%20assistance."
   target="_blank"
   class="whatsapp-float"
   style="position:fixed; bottom:30px; right:30px; z-index:9999; background:#25D366; color:white; padding:14px 22px; border-radius:50px; display:flex; align-items:center; gap:10px; box-shadow:0 4px 20px rgba(0,0,0,0.15); text-decoration:none; font-weight:600; font-size:16px; transition:0.3s;">
    <i data-lucide="message-circle" style="width:24px;height:24px;"></i>
    {{ support_settings.support_button_text }}
</a>

<script>
    // Ensure Lucide icons are loaded
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    });
</script>
