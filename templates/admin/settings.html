{% extends "admin/base.html" %}
{% block title %}Settings{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block content %}
<form method="POST">
    <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600;">Commission Rate (%)</label>
        <input type="number" name="commission_rate" value="{{ settings.get('commission_rate', '30') }}" style="width: 200px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px;">
    </div>
    <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600;">Minimum Withdrawal (₦)</label>
        <input type="number" name="min_withdrawal" value="{{ settings.get('min_withdrawal', '5000') }}" style="width: 200px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px;">
    </div>

    <!-- ===== NEW: Customer Support Settings ===== -->
    <hr style="margin: 24px 0; border: none; border-top: 1px solid #e5e7eb;">

    <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 16px;">📞 Customer Support Settings</h3>

    <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600;">WhatsApp Phone Number</label>
        <input type="text" name="support_phone" value="{{ settings.get('support_phone', '2348012345678') }}" style="width: 300px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px;" placeholder="e.g. 2348012345678">
        <small style="display: block; color: #6b7280; margin-top: 4px;">Include country code without '+' (e.g., 2348012345678)</small>
    </div>

    <div style="margin-bottom: 24px;">
        <label style="display: block; font-weight: 600;">Floating Button Text</label>
        <input type="text" name="support_button_text" value="{{ settings.get('support_button_text', 'Chat with Admin on WhatsApp') }}" style="width: 400px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px;" placeholder="e.g. Chat with Admin on WhatsApp">
    </div>
    <!-- ========================================= -->

    <button class="btn btn-success" type="submit">Save Settings</button>
</form>
{% endblock %}
