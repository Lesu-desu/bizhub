<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Setup | Step 1 | BizHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/transitions.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

    <style>
        .vendor-layout {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 7%;
        }
        .vendor-card {
            max-width: 620px;
            width: 100%;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 42px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 25px 50px rgba(0,0,0,0.08);
        }
        .wizard-top {
            margin-bottom: 34px;
        }
        .wizard-step {
            display: inline-block;
            background: rgba(25, 193, 95, 0.12);
            color: #0f9f49;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .wizard-top h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .wizard-top p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }
        .progress {
            width: 100%;
            height: 6px;
            background: #e2e8e5;
            border-radius: 999px;
            margin: 20px 0 16px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #16bf5c, #0f9e48);
            border-radius: 999px;
            transition: width 0.5s ease;
        }
        .progress-20 { width: 20%; }
        .step-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .step-indicator .circle {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e2e8e5;
            transition: 0.3s ease;
        }
        .step-indicator .circle.active {
            background: #13b355;
        }
        .step-indicator .line {
            flex: 1;
            height: 2px;
            background: #e2e8e5;
            transition: 0.3s ease;
            min-width: 20px;
        }
        .step-indicator .line.active {
            background: #13b355;
        }
        .phone-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .phone-input span {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 16px 0 0 16px;
            border: 1.5px solid #e2e8e5;
            border-right: none;
            font-weight: 600;
            color: #333;
        }
        .phone-input input {
            border-radius: 0 16px 16px 0 !important;
        }
        .wizard-buttons {
            display: flex;
            gap: 16px;
            margin-top: 8px;
        }
        .wizard-buttons .secondary-btn {
            flex: 1;
            text-align: center;
            padding: 16px;
            border: 1.5px solid #e2e8e5;
            border-radius: 14px;
            background: white;
            color: #333;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s ease;
        }
        .wizard-buttons .secondary-btn:hover {
            border-color: #13b355;
            background: rgba(19, 179, 85, 0.05);
        }
        .wizard-buttons .primary-btn {
            flex: 2;
        }
        @media (max-width: 500px) {
            .vendor-card { padding: 28px 20px; }
            .wizard-buttons { flex-direction: column; }
            .wizard-buttons .secondary-btn { order: 2; }
            .phone-input { flex-direction: column; }
            .phone-input span {
                border-radius: 16px 16px 0 0;
                border-right: 1.5px solid #e2e8e5;
                border-bottom: none;
                width: 100%;
                text-align: center;
            }
            .phone-input input { border-radius: 0 0 16px 16px !important; }
        }
    </style>
</head>

<body class="page-transition">

<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<header class="topbar fade-down">
    <a href="{{ url_for('index') }}" class="logo-wrapper">
        <div class="logo-icon">B</div>
        <div>
            <h1 class="logo-text">BizHub</h1>
            <p class="logo-subtext">Marketplace & Learning Platform</p>
        </div>
    </a>
</header>

<main class="vendor-layout fade-up">
    <div class="vendor-card">
        <div class="wizard-top">
            <span class="wizard-step">Step 1 of 5</span>
            <h2>Business Identity</h2>
            <p>Let's start by learning about your business. This information helps customers identify and trust your brand.</p>

            <div class="progress">
                <div class="progress-fill progress-20"></div>
            </div>

            <div class="step-indicator">
                <div class="circle active"></div><div class="line active"></div>
                <div class="circle"></div><div class="line"></div>
                <div class="circle"></div><div class="line"></div>
                <div class="circle"></div><div class="line"></div>
                <div class="circle"></div>
            </div>
        </div>

        <form id="vendorStep1Form">
            <div class="input-group">
                <label>Business Name</label>
                <input type="text" id="business_name" required placeholder="Cadmus Technologies">
            </div>

            <div class="input-group">
                <label>Business Email</label>
                <input type="email" id="business_email" required placeholder="business@example.com">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <div class="phone-input">
                    <span>+234</span>
                    <input type="tel" id="business_phone" required placeholder="8012345678">
                </div>
            </div>

            <div class="input-group">
                <label>Business Website (Optional)</label>
                <input type="url" id="website" placeholder="https://yourwebsite.com">
            </div>

            <div class="wizard-buttons">
                <a href="{{ url_for('choose_role') }}" class="secondary-btn">← Back</a>
                <button type="submit" class="primary-btn">Continue →</button>
            </div>
        </form>
    </div>
</main>

<script src="{{ url_for('static', filename='js/transitions.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('vendorStep1Form');

    if (form) {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const button = this.querySelector('.primary-btn');
            button.disabled = true;
            button.textContent = 'Saving...';

            const data = {
                business_name: document.getElementById('business_name').value.trim(),
                business_email: document.getElementById('business_email').value.trim(),
                business_phone: document.getElementById('business_phone').value.trim(),
                website: document.getElementById('website').value.trim()
            };

            if (!data.business_name) {
                alert('Business name is required.');
                button.disabled = false;
                button.textContent = 'Continue →';
                return;
            }

            try {
                const response = await fetch('{{ url_for("vendor_step1") }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = result.redirect;
                } else {
                    alert(result.message || 'Something went wrong');
                    button.disabled = false;
                    button.textContent = 'Continue →';
                }
            } catch (error) {
                alert('Network error. Please try again.');
                button.disabled = false;
                button.textContent = 'Continue →';
            }
        });
    }
});
</script>
</body>
</html>
